<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Falling Objects</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .game-container {
            position: relative;
            width: 300px;
            height: 400px;
            border: 2px solid #333;
            overflow: hidden;
            background-color: white;
        }

        .falling-objects {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .object {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: red;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Catch the Falling Objects!</h1>
        <div id="score">Score: 0</div>
        <div class="falling-objects"></div>
    </div>
    <script>
        const scoreElement = document.getElementById("score");
        const fallingObjectsContainer = document.querySelector(".falling-objects");
        let score = 0;

        function createFallingObject() {
            const object = document.createElement("div");
            object.className = "object";
            object.style.left = Math.random() * (fallingObjectsContainer.clientWidth - 30) + "px";
            fallingObjectsContainer.appendChild(object);

            object.addEventListener("click", () => {
                score++;
                scoreElement.textContent = `Score: ${score}`;
                object.remove();
            });

            let fallInterval = setInterval(() => {
                const top = parseFloat(getComputedStyle(object).top) || 0;
                if (top >= fallingObjectsContainer.clientHeight) {
                    clearInterval(fallInterval);
                    object.remove();
                } else {
                    object.style.top = top + 5 + "px";
                }
            }, 100);

            setTimeout(() => {
                clearInterval(fallInterval);
                object.remove();
            }, 5000); 
        }

        setInterval(createFallingObject, 1000); 
    </script>
</body>
</html>
